[project]
name = "rastreo-aereo-back"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymoo>=0.6.2",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
